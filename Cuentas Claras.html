<style>

*{box-sizing:border-box}

.step .t b{display:block}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.banner .btn{min-height:40px;padding:6px 14px}
input,select,textarea{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}

.form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.err{color:var(--bad);font-weight:600}
.lead{font-size:1.05rem;color:var(--muted)}

.chip input,.opt input{position:absolute;opacity:0;pointer-events:none}
.chip{position:relative}
.chip span{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:block}
.opt>div{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);min-height:52px;min-width:0}

.prof{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}

.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.secret{font-variant-numeric:tabular-nums;cursor:pointer;background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:2px 8px}

.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.table th,.table td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

.pos{color:var(--good);font-weight:700}.neg-t{color:var(--bad);font-weight:700}
.msg{display:flex;flex-direction:column;gap:8px}
.msg-h{font-weight:700}

.tplt{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);background:var(--surface2);border-radius:12px;padding:12px;font-size:.95rem}
.vars{display:flex;flex-wrap:wrap;gap:6px}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}

.panel-h h2{font-size:1.4rem}
.panel-b{display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:22px;max-height:90%}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.pinbig{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.note{background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.done .btn.sent{background:var(--good-soft);border-color:var(--good);color:var(--good)}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s}}
</style>

function svc(id){return S.services.find(function(x){return x.id===id})||{id:id,name:'(plataforma borrada)',color:'#7B8794'}}

function cust(id){return S.customers.find(function(x){return x.id===id})}
function subById(id){return S.subs.find(function(x){return x.id===id})}
function prof(a,id){return a&&a.profiles.find(function(p){return p.id===id})}
function fullName(c){return (c.nombre+' '+(c.apellido||'')).trim()}
function subsOfProfile(aid,pid){return S.subs.filter(function(s){return s.accountId===aid&&s.profileId===pid})}
function used(a){return S.subs.filter(function(s){return s.accountId===a.id}).length}
function cap(a){return a.profiles.length*a.perProfile}

function varsFor(s){
 var c=cust(s.customerId),a=acct(s.accountId),p=prof(a,s.profileId);
 return {nombre:c.nombre,apellido:c.apellido||'',plataforma:svc(a.serviceId).name,correo:a.email,clave:a.password,perfil:p.name,pin:p.pin,fecha:fmtDate(s.nextDue),monto:money(num(s.price))};

function tpl(key){var t=S.templates.find(function(x){return x.key===key});return (t||defaultTemplates().find(function(x){return x.key===key})).text}

function waUrl(phone,text){
 var d=String(phone||'').replace(/\D/g,'');if(!d)return '';
 if(d.indexOf('00')===0)d=d.slice(2);
 else if(d.length<=9)d=String(S.settings.cc||'51')+d;
 return 'https://wa.me/'+d+'?text='+encodeURIComponent(text);
}
function dueInfo(s){
 var d=daysBetween(today(),s.nextDue),k,t;
 if(s.cut){k='cut';t='Suspendido'}
 else if(d<0){k='late';t=d===-1?'Venció ayer':'Venció hace '+(-d)+' días'}
 else if(d===0){k='today';t='Vence hoy'}
 else if(d===1){k='soon';t='Vence mañana'}
 else if(d<=S.settings.warn){k='soon';t='Vence en '+d+' días'}
 else{k='ok';t='Vence el '+fmtDate(s.nextDue)}
 return {d:d,k:k,t:t};
}
function nextAfterPaid(s){
 var t=today();
 if(s.cut)return addMonth(t,parse(t).getDate());
 var n=addMonth(s.nextDue,s.payDay);
 while(daysBetween(t,n)<0)n=addMonth(n,s.payDay);
 return n;
}

function cache(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem(SK);if(r)return JSON.parse(r)}catch(e){}return null}
function setSync(k){
 var e=$('#sync');e.className='sync'+(k==='err'?' err':'');
 e.textContent={ok:'Guardado en tu cuenta',saving:'Guardando…',local:'Solo en este dispositivo',err:'No se pudo guardar'}[k]||'';
}
function save(){
 cache();
 if(!db||!docRef)return;
 dirty=true;setSync('saving');clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
}
function flush(){
 if(saving)return;
 saving=true;dirty=false;
 docRef.set({state:JSON.parse(JSON.stringify(S)),updatedAt:Date.now()}).then(function(){saving=false;setSync(dirty?'saving':'ok');if(dirty)flush()}).catch(function(){saving=false;setSync('err')});
}
function hasContent(s){return s.accounts.length||s.customers.length}
function initDb(){
 var p;try{p=window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)}catch(e){p=Promise.resolve(null)}
 p.then(function(d){
  db=d;
  if(!db){setSync('local');return}
  docRef=db.doc('app/state');
  docRef.onSnapshot(function(snap){
   if(snap.exists){
    var remote=snap.data()&&snap.data().state;
    if(remote&&!snap.metadata.hasPendingWrites&&!dirty&&!saving){
     remote=normalize(JSON.parse(JSON.stringify(remote)));
     if(JSON.stringify(remote)!==JSON.stringify(S)){S=remote;cache();renderAll()}
    }
    if(!dirty&&!saving)setSync('ok');
   }else{
    if(hasContent(S)){dirty=true;flush()}else setSync('ok');
   }
  },function(){db=null;setSync('local')});
 }).catch(function(){db=null;setSync('local')});
}

function vDinero(){
 var invest=0,income=0,maxInc=0;
 S.accounts.forEach(function(a){invest+=num(a.cost);maxInc+=num(a.price)*cap(a)});
 S.subs.forEach(function(s){if(!s.cut)income+=num(s.price)});
 var profit=income-invest;
 var rows=S.accounts.map(function(a){
  var inc=S.subs.filter(function(s){return s.accountId===a.id&&!s.cut}).reduce(function(t,s){return t+num(s.price)},0),p=inc-num(a.cost),sv=svc(a.serviceId);
  return '<tr><td>'+svcDot(sv)+' <b>'+esc(sv.name)+'</b><br><span class="sub">'+esc(a.email)+'</span><div class="bar" style="margin-top:6px"><i style="width:'+Math.round(100*used(a)/Math.max(1,cap(a)))+'%"></i></div></td><td>'+used(a)+'/'+cap(a)+'</td><td>'+money(num(a.cost))+'</td><td>'+money(inc)+'</td><td class="'+(p>=0?'pos':'neg-t')+'">'+money(p)+'</td></tr>';
 }).join('');
 return '<div class="head"><h1>Dinero</h1><p class="sub">Lo que ganas cada mes, contando solo clientes activos.</p></div>'+
  '<div class="hero'+(profit<0?' neg':'')+'"><small>Ganancia mensual aproximada</small><span class="big-n">'+money(profit)+'</span><small>'+money(income)+' que cobras − '+money(invest)+' que inviertes</small></div>'+
  '<div class="card"><div class="card-h"><span>Cobro mensual esperado</span><b>'+money(income)+'</b></div><div class="card-h"><span>Inversión en cuentas</span><b>'+money(invest)+'</b></div><div class="card-h"><span>Ganancia si llenas todos los lugares</span><b>'+money(maxInc-invest)+'</b></div></div>'+
  (S.accounts.length?'<h2 class="section-t">Por cuenta</h2><div class="card"><div class="tscroll"><table class="table"><thead><tr><th>Cuenta</th><th>Lugares</th><th>Invierto</th><th>Cobro</th><th>Ganancia</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="empty"><b>Sin cuentas todavía</b><span>Agrega una cuenta con su inversión y cobro para ver tu ganancia.</span></div>')+
  '<p class="sub">Los clientes suspendidos no se cuentan hasta que paguen.</p>';
}

 editSub:function(d){editSub(d.id)},

 delSub:function(d,b){if(!confirmTap(b))return;var s=subById(d.id),cid=s.customerId;S.subs=S.subs.filter(function(x){return x.id!==d.id});save();render();custSheet(cid);toast('Servicio quitado')},
 subMsg:function(d){var s=subById(d.id),c=cust(s.customerId);msgSheet('Datos de '+c.nombre,'',[msgItem(fullName(c),c.whatsapp,msgFor('bienvenida',s))])},
 payMsg:function(d){var s=subById(d.id),c=cust(s.customerId),k=dueInfo(s).d<0?'cobro_vencido':'cobro';msgSheet('Cobro a '+c.nombre,'',[msgItem(fullName(c),c.whatsapp,msgFor(k,s))])},
 paid:function(d){paidSheet(d.id)},
 confirmPaid:function(d){confirmPaid(d.id)},
 cut:function(d){cutSheet(d.id)},
 doCut:function(d){doCut(d.id)},
 copy:function(d,b){var t=b.closest('.msg').querySelector('textarea');copyText(t.value)},
 reveal:function(d,b){b.textContent=b.textContent==='Toca para ver'?b.dataset.pw:'Toca para ver'},
 newAccount:function(d){accForm(null,d.svc)},
 editAccount:function(d){accForm(d.id)},
 saveAccount:function(d){saveAccount(d.id)},
 delAccount:function(d,b){var a=acct(d.id);if(used(a)){toast('Primero quita a los clientes de esta cuenta');return}if(!confirmTap(b))return;S.accounts=S.accounts.filter(function(x){return x.id!==d.id});save();closeSheet();render()},
 addProfile:function(d){var a=acct(d.id),n=a.profiles.length;a.profiles.push({id:uid(),name:COLORS[n]?COLORS[n][0]:'Perfil '+(n+1),pin:randPin()});save();render();toast('Perfil agregado')},
 profSheet:function(d){profSheet(d.id,d.id2)},
 saveProf:function(d){saveProf(d.id,d.id2)},
 delProf:function(d,b){if(!confirmTap(b))return;var a=acct(d.id);a.profiles=a.profiles.filter(function(p){return p.id!==d.id2});save();closeSheet();render()},
 newService:svcForm,
 saveService:function(){var n=v('sv-name');if(!n)return showErr('sv-err','Escribe el nombre de la plataforma.');S.services.push({id:uid(),name:n,color:$('#sv-color').value});save();closeSheet();render();toast('Plataforma agregada')},
 tplNew:function(){tplForm(null)},
 tplEdit:function(d){tplForm(d.id)},
 saveTpl:function(d){var ti=v('tp-title'),tx=$('#tp-text').value.trim();if(!ti||!tx)return showErr('tp-err','Escribe el nombre y el texto.');
  if(d.id){var t=S.templates.find(function(x){return x.id===d.id});t.title=ti;t.text=tx}else S.templates.push({id:uid(),cat:'mios',title:ti,text:tx});
  save();closeSheet();render();toast('Mensaje guardado')},
 delTpl:function(d,b){if(!confirmTap(b))return;S.templates=S.templates.filter(function(x){return x.id!==d.id});save();closeSheet();render()},
 resetTpl:function(d){var t=S.templates.find(function(x){return x.id===d.id}),o=defaultTemplates().find(function(x){return x.key===t.key});t.text=o.text;t.title=o.title;save();closeSheet();render();toast('Texto original')},
 insVar:function(d){var t=$('#tp-text'),s=t.selectionStart==null?t.value.length:t.selectionStart,e=t.selectionEnd==null?s:t.selectionEnd;t.value=t.value.slice(0,s)+d.v+t.value.slice(e);t.focus();t.selectionStart=t.selectionEnd=s+d.v.length},
 copyTpl:function(d){var t=S.templates.find(function(x){return x.id===d.id}),s=msgSubId?subById(msgSubId):null;copyText(s?fill(t.text,varsFor(s)):t.text)},
 settings:settingsSheet,
 saveSettings:function(){S.settings.cc=(v('st-cc').replace(/\D/g,''))||'51';S.settings.warn=parseInt($('#st-warn').value,10)||3;save();closeSheet();render();toast('Ajustes guardados')},
 loadDemo:function(){var keep=S.settings;S=demo();S.settings.cc=keep.cc;S.settings.warn=keep.warn;save();closeSheet();tab='hoy';render()},
 clearDemo:function(){var keep=S.settings;S=blank();S.settings.cc=keep.cc;S.settings.warn=keep.warn;save();closeSheet();tab='hoy';render();toast('Listo, empieza de cero')}
};
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var f=A[b.dataset.act];if(!f)return;
 if(b.tagName==='A'&&b.getAttribute('href')==='#')e.preventDefault();
 f(b.dataset,b,e);
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='reveal'){e.preventDefault();A.reveal(e.target.dataset,e.target)}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){q=t.value;$('#clist').innerHTML=clientList()}
 if(t.classList&&t.classList.contains('msg-text')){var a=t.closest('.msg').querySelector('a[data-wa]');if(a)a.href=waUrl(a.dataset.phone,t.value)}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='msgSub'){msgSubId=t.value;render()}
 if(t.name==='af-svc'){AF.svc=t.value;AF.acc=null;AF.prof=null;afRefresh(true)}
 if(t.name==='af-acc'){AF.acc=t.value;AF.prof=null;afRefresh(true)}
 if(t.name==='af-prof'){AF.prof=t.value}
});

/* ---------- inicio ---------- */
S=loadLocal();
S=normalize(S||blank());
render();
setSync('local');
initDb();
})();
</script>

</body></html>
